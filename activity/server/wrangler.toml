name = "cwl-clan-config-server"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# CLIENT_ID is not secret (it's public in the OAuth flow anyway) so it lives here as a plain
# var, per environment. CLIENT_SECRET / BRIDGE_URL / BRIDGE_SECRET are real secrets — never put
# them here. Set them per environment with:
#   wrangler secret put CLIENT_SECRET --env dev
#   wrangler secret put BRIDGE_URL --env dev       (Phase B: the cloudflared tunnel URL for the DEV bot)
#   wrangler secret put BRIDGE_SECRET --env dev     (Phase B: shared secret with ClashControl's bridge API)
# ...and again with --env prod once the PROD bot/tunnel exist (Phase D).

# REDIRECT_URI must exactly match a URL registered under OAuth2 -> Redirects in the Developer
# Portal for that application. Nothing ever actually navigates there for an Activity (the SDK
# exchanges the code in-iframe) — Discord's /oauth2/token endpoint just requires it to be
# present and registered, per standard OAuth2 authorization_code grant rules.

# routes: each Worker is served on its own clashcontrol.uk hostname (Custom Domain — wrangler
# creates the DNS record + certificate on deploy). The Developer Portal's Activity URL Mapping
# `/api` points at that hostname. workers_dev = true is required alongside: as soon as `routes`
# is set, wrangler turns the workers.dev URL OFF unless told otherwise, which would cut off a
# portal mapping that still points there. Keeping both makes the mapping switch downtime-free.

[env.dev]
name = "cwl-clan-config-server-dev"
vars = { CLIENT_ID = "1442060461783781479", REDIRECT_URI = "https://cwl-clan-config-dev.pages.dev/" }
routes = [{ pattern = "api-dev.clashcontrol.uk", custom_domain = true }]
workers_dev = true

[env.prod]
name = "cwl-clan-config-server-prod"
vars = { CLIENT_ID = "1394733938961944787", REDIRECT_URI = "https://cwl-clan-config-prod.pages.dev/" }
routes = [{ pattern = "api.clashcontrol.uk", custom_domain = true }]
workers_dev = true
