<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Bench / "Ersatzbank" status (tracker #0114) — same rounded-square shape and padding as
       gcheck.svg/redx.svg/pending.svg/autoconfirmed.svg. Blue (#5b8def) sits clearly apart from
       the greens (confirmed/auto-confirmed), the yellow (pending) and the red (declined) already
       in use, so the five statuses stay distinguishable at card size. -->
  <rect x="10" y="10" width="44" height="44" rx="10" fill="#5b8def"/>
  <!-- White bench: backrest, seat, two legs -->
  <rect x="19" y="22" width="26" height="4.5" rx="2.25" fill="white"/>
  <rect x="19" y="31" width="26" height="5" rx="2.5" fill="white"/>
  <rect x="21.5" y="36" width="4" height="8" rx="2" fill="white"/>
  <rect x="38.5" y="36" width="4" height="8" rx="2" fill="white"/>
</svg>
